<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="/logo.png" />
    <link rel="apple-touch-icon" href="/logo.png" />

    <!-- Google Search Console verification -->
    <meta name="google-site-verification" content="UWhqVnmrVhCDAy9g1y3luPKWq4Do_yfnZ31AR0y83X0" />

    <!-- Base defaults — react-helmet-async overrides these per page -->
    <title>Level Up AI — Turn Any Topic Into Animated Video Lessons</title>
    <meta name="description" content="Type a topic or upload your notes. Level Up AI generates 6 animated, narrated video lessons and a 20-question quiz in minutes. First lesson always free." />
    <meta name="theme-color" content="#15131F" />

    <!-- Base Open Graph fallback -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Level Up AI" />
    <meta property="og:title" content="Level Up AI — Turn Any Topic Into Animated Video Lessons" />
    <meta property="og:description" content="Type a topic or upload your notes. Get 6 animated lessons with narration and a quiz in minutes. First lesson always free." />
    <meta property="og:image" content="https://leveluppedu.app/logo.png" />
    <meta property="og:url" content="https://leveluppedu.app" />

    <!-- Base Twitter/X fallback -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Level Up AI — Turn Any Topic Into Animated Video Lessons" />
    <meta name="twitter:description" content="Type a topic or upload your notes. Get 6 animated lessons with narration and a quiz in minutes." />
    <meta name="twitter:image" content="https://leveluppedu.app/logo.png" />

    <!-- Sitemap hint for crawlers -->
    <link rel="sitemap" type="application/xml" href="/sitemap.xml" />

    <!-- Preconnect to font CDN for faster load -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- App font stylesheet, loaded non-render-blocking (media="print" swapped
         to "all" onload — the standard pattern for an async CSS load without
         a FOUC-prone deferred JS import). Previously this was loaded via a
         render-blocking @import inside a React component's inline <style>
         tag, which meant the browser couldn't even discover the font request
         until after JS parsed and rendered that component — strictly worse
         than this, despite the preconnect hints above already being here. -->
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
